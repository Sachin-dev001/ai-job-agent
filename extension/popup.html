<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Auto-Apply Agent</title>
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      background: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #27272a;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .icon {
      width: 28px;
      height: 28px;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #10b981;
      font-weight: bold;
    }
    h1 {
      font-size: 14px;
      margin: 0;
      font-weight: 700;
    }
    .sub {
      font-size: 11px;
      color: #a1a1aa;
    }
    .status-card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .status-row:last-child {
      margin-bottom: 0;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .btn {
      width: 100%;
      background: #10b981;
      color: #09090b;
      border: none;
      border-radius: 6px;
      padding: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #34d399;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">⚡</div>
    <div>
      <h1>AI Auto-Apply Agent</h1>
      <div class="sub">Autonomous Browser Engine</div>
    </div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span style="color:#a1a1aa">Status</span>
      <span class="badge">ACTIVE • ZERO CAPTCHA</span>
    </div>
    <div class="status-row">
      <span style="color:#a1a1aa">Naukri DOM Robot</span>
      <span style="color:#34d399; font-weight:600">Enabled</span>
    </div>
    <div class="status-row">
      <span style="color:#a1a1aa">Wellfound DOM Robot</span>
      <span style="color:#34d399; font-weight:600">Enabled</span>
    </div>
  </div>

  <button class="btn" id="openDashboardBtn">Open AI Job Console ↗</button>

  <script src="popup.js"></script>
</body>
</html>
