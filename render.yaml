services:
  - type: web
    name: autoapply-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONPATH
        value: ".:backend"
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SUPABASE_URL
        value: https://iyqcrvdmlbtzrehwaxvl.supabase.co
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_NAnZqKhLVDso23lHeRV_HA_BpJ0fJn9
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
